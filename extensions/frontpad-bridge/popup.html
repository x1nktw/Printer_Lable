<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>LabelPrint Bridge</title>
  <style>
    body {
      margin: 0;
      width: 320px;
      min-height: 280px;
      padding: 28px 20px 24px;
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: #111;
      background: #fff;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .ver {
      margin: 6px 0 22px;
      font-size: 13px;
      color: #9a9a9a;
    }
    .hint {
      margin: 0 auto 22px;
      max-width: 260px;
      font-size: 14px;
      line-height: 1.35;
      color: #222;
    }
    .preview {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: #2a2a2a;
      color: #fff;
      user-select: none;
    }
    .preview__icon {
      width: 24px;
      height: 24px;
      color: #e74c3c;
    }
    .preview.ok .preview__icon {
      color: #6ac579;
    }
    .preview__icon svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: currentColor;
    }
    .preview__label {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .foot {
      margin-top: 22px;
      font-size: 11px;
      color: #999;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <h1>LabelPrint.Bridge</h1>
  <div class="ver" id="version">Версия …</div>
  <p class="hint">
    Для подключения к LabelPrint<br />
    нажмите в программе Frontpad кнопку «LP»
  </p>
  <div class="preview" id="preview" title="Кнопка LP на странице FrontPad">
    <div class="preview__icon" id="previewIcon" aria-hidden="true"></div>
    <div class="preview__label">LP</div>
  </div>
  <div class="foot" id="foot"></div>
  <script src="popup.js"></script>
</body>
</html>
