name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore LabelPrint.sln

      - name: Build
        run: dotnet build LabelPrint.sln -c Release --no-restore

      - name: Test
        run: dotnet test LabelPrint.sln -c Release --no-build --verbosity normal
