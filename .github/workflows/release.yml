name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install vpk
        shell: pwsh
        run: |
          dotnet tool update -g vpk --version 1.2.0
          if ($LASTEXITCODE -ne 0) { dotnet tool install -g vpk --version 1.2.0 }
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Pack Velopack + Bridge
        id: pack
        shell: pwsh
        run: |
          ./scripts/pack-release.ps1 -Version "${{ steps.ver.outputs.version }}" -Configuration Release
          $manifest = Get-Content "extensions/frontpad-bridge/manifest.json" -Raw | ConvertFrom-Json
          "bridge_version=$($manifest.version)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: LabelPrint Pro ${{ steps.ver.outputs.version }}
          draft: false
          generate_release_notes: true
          body: |
            ## LabelPrint Pro ${{ steps.ver.outputs.version }}

            Первый стабильный контур: каталог, маркировка, заказы FrontPad, шаблоны, очередь печати, Velopack.

            ## Скачать

            | Файл | Назначение |
            |------|------------|
            | **LabelPrintPro-win-Setup.exe** | Первая установка (Velopack) |
            | **LabelPrintPro-win-Portable.zip** | Portable |
            | **\*.nupkg** + **releases\*.json** | Канал автообновления |
            | **frontpad-bridge-${{ steps.pack.outputs.bridge_version }}.zip** | Только расширение Chrome/Edge |

            ## Обновление

            После Velopack Setup: **Настройки → Система → Обновить** (один клик).

            - С **0.9.x** — Обновить в приложении или новый Setup.
            - С **0.8.x (Inno)** — однократно поставить новый Setup.
            - Bridge: обновить расширение и перезагрузить вкладку FrontPad.

            Changelog: [CHANGELOG.md](https://github.com/x1nktw/Printer_Lable/blob/main/CHANGELOG.md) · Install: [INSTALLER.md](https://github.com/x1nktw/Printer_Lable/blob/main/docs/INSTALLER.md) · Кухня: [FRONTPAD_KITCHEN.md](https://github.com/x1nktw/Printer_Lable/blob/main/docs/FRONTPAD_KITCHEN.md)
          files: |
            artifacts/release/*.exe
            artifacts/release/*.nupkg
            artifacts/release/*.json
            artifacts/release/frontpad-bridge-*.zip
            artifacts/release/*.zip
